name: scratch - mta cleanup

# Temporary, one-time recovery action - not part of the real pipeline.
# See earlier commits' identical comment: clears stale "create failed"
# tracked state after a failed procurement-core deploy attempt so the
# next real cf deploy starts clean. Delete this file once run.

on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install cf CLI + multiapps plugin
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
          cf install-plugin -f multiapps
      - name: cf login and undeploy the stuck procurement-core MTA
        env:
          CF_USERNAME: ${{ secrets.BTP_USERNAME }}
          CF_PASSWORD: ${{ secrets.BTP_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s dev
          cf undeploy procurement-core --delete-services -f || true
          echo "=== remaining services in dev ==="
          cf services
