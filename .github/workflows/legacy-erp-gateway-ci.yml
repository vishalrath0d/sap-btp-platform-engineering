name: legacy-erp-gateway CI

# Same monorepo convention as procurement-core-ci.yml.

on:
  push:
    branches: [main]
    paths:
      - "services/legacy-erp-gateway/**"
      - ".github/workflows/legacy-erp-gateway-ci.yml"
  pull_request:
    paths:
      - "services/legacy-erp-gateway/**"

defaults:
  run:
    working-directory: services/legacy-erp-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/legacy-erp-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    if: false # remove once ready to deploy for real - see procurement-core-ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Install cf CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf

      - name: cf login
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api https://api.cf.us10.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o procureiq-dev -s dev

      - name: cf push
        run: cf push -f manifest.yml
