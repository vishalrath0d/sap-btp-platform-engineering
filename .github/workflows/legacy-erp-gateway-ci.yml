name: legacy-erp-gateway CI

# Test-only, path-filtered - see ai-copilot-ci.yml's comment for why
# deploy lives in .github/workflows/cf-deploy.yml instead.

on:
  push:
    branches: [main]
    paths:
      - "services/legacy-erp-gateway/**"
      - ".github/workflows/legacy-erp-gateway-ci.yml"
  pull_request:
    paths:
      - "services/legacy-erp-gateway/**"

defaults:
  run:
    working-directory: services/legacy-erp-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/legacy-erp-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
