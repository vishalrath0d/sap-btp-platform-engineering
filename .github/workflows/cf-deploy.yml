name: cf deploy (all Cloud Foundry services)

# One deploy pipeline for every Cloud Foundry-bound service - back to
# four (procurement-core, ai-copilot, legacy-erp-gateway, api-gateway):
# spend-anomaly-detector moved back to its real target, Kyma
# (kyma-deploy.yml), once SAP approved the trial Kyma request - it had
# been here temporarily (see git history around session 10-11) while
# that approval was pending. These four are a bound landscape
# (api-gateway calls procurement-core, procurement-core calls
# legacy-erp-gateway and, cross-runtime, spend-anomaly-detector on
# Kyma), not independently-released products, so one pipeline that
# deploys and sequences them correctly is the more honest shape than
# four separate `if: false` jobs that all happened to exist in
# different files. Testing
# stays per-service on purpose (test.yml - one file, real per-service
# change-detection via dorny/paths-filter) - that split IS standard, real
# monorepo practice: a change to ai-copilot shouldn't re-run
# procurement-core's test suite, and each PR gets a fast, correctly-scoped
# status check. Deploying is the part that
# benefits from being one pipeline; testing is the part that doesn't.
#
# `workflow_call` lets deploy.yml invoke this as one option in the full
# landscape sequence (terraform apply -> this -> kyma-deploy.yml);
# `workflow_dispatch` lets it run standalone when only the CF side needs
# redeploying. Both paths read `inputs.environment` via the same unified
# `inputs` context (real GitHub Actions feature - workflow_dispatch and
# workflow_call inputs were unified onto one context, confirmed against
# GitHub's own changelog, not assumed).
#
# Deliberately NOT one giant MTA bundling all four modules together: MTA
# exists for resources genuinely bound at the deploy-artifact level
# (procurement-core's app + its HDI container + its XSUAA instance, which
# MUST version and deploy atomically) - these four services are separate
# deployables with separate release cadences, which is the actual point
# of them being microservices. This pipeline coordinates WHEN they deploy
# together; it doesn't erase that they're independently deployable units.
#
# `secrets.CF_USERNAME`/`secrets.CF_PASSWORD` below are this workflow's
# own declared `workflow_call` parameters (see `on.workflow_call.secrets`)
# - real GitHub Actions constraint, hit live and fixed: a reusable
# workflow's `secrets.*` context is scoped to exactly what it declares,
# not the full repo secret store, even if a same-named repo secret
# exists (confirmed via `actionlint`, a real static type-checker for
# this). There is no separate CF-specific secret actually stored in this
# repo - `deploy.yml`'s own passthrough (`CF_USERNAME: ${{ secrets.
# BTP_USERNAME }}`) is what supplies the real value when this runs via
# `workflow_call`, since a Cloud Foundry org on BTP authenticates with
# the same SAP Universal ID as the cockpit login. Running this workflow
# standalone via `workflow_dispatch` instead (bypassing `deploy.yml`)
# would need real `CF_USERNAME`/`CF_PASSWORD` repo secrets to exist too -
# not yet created, since `deploy.yml` is the path actually used so far.
#
# `-o 4cbf0c12trial` below is this trial's real, SAP-assigned CF org
# name (confirmed via `cf orgs`) - not a name this project chose.
# Terraform's modules/cloudfoundry-env adopts this pre-existing org
# rather than creating a second one (trial accounts don't allow that),
# so a "procureiq-<env>" name was never real here. Update this literal
# if the org ever changes (a different trial, moving to a paid account).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        required: true
        type: choice
        options: [dev, qa, prod]
      confirm:
        description: 'Type "deploy" to confirm you intend to run this against the real BTP account'
        required: true
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      CF_USERNAME:
        required: true
      CF_PASSWORD:
        required: true

jobs:
  verify-confirmation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::Confirmation input must be exactly 'deploy' - got '${{ inputs.confirm }}'"
          exit 1

  procurement-core:
    needs: [verify-confirmation]
    if: always() && needs.verify-confirmation.result != 'failure'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: services/procurement-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the MTA
        run: |
          npm install -g mbt
          npm ci
          # Bare `npx cds` intermittently fails ("could not determine
          # executable to run") - real bug hit live on this branch's CI,
          # same underlying cause the procurement-core Dockerfile's own
          # comment documents: @sap/cds is a real dependency here, but it
          # doesn't ship the `cds` CLI itself - that's the separate
          # @sap/cds-dk package. `npx cds` normally works anyway by
          # fetching @sap/cds-dk on the fly, but that on-the-fly
          # resolution isn't reliable - pinning it explicitly with `-p`
          # is the fix, not a network retry.
          npx -p @sap/cds-dk cds build --production
          mbt build --platform cf
      - name: Install cf CLI + multiapps plugin
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
          cf install-plugin -f multiapps
      - name: Ensure the shared HANA Cloud database exists (CF-space-scoped)
        # Real capability boundary hit live: the "hana"/"hdi-shared" broker
        # needs a database visible to THIS CF space specifically, and
        # Terraform's SAP/btp provider can only create Service-Manager/
        # subaccount-scoped instances (no CF-space/platform concept
        # anywhere in its real schema - checked exhaustively before
        # concluding this, see infra/terraform/main.tf's module.hana_cloud
        # comment). cf create-service, run directly against this space,
        # is what actually produces a broker-visible instance - confirmed
        # via the BTP cockpit's own Space > Service Instances view. Params
        # are the plan's real published create schema (`cf curl
        # /v3/service_plans/<hana-free guid>` -> .schemas.service_instance.
        # create.parameters, queried live): data.edition and data.memory
        # are required (memory fixed at 16 for hana-free), and the broker
        # separately requires generateSystemPassword at runtime (not
        # captured in the published schema's own `required` list).
        # Idempotent - skips creation if a later deploy finds it already
        # exists, rather than erroring on "already exists".
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s ${{ inputs.environment }}
          if cf service procureiq-${{ inputs.environment }}-hana-cloud >/dev/null 2>&1; then
            echo "procureiq-${{ inputs.environment }}-hana-cloud already exists, skipping creation"
          else
            cf create-service hana-cloud hana-free procureiq-${{ inputs.environment }}-hana-cloud \
              -c '{"data":{"memory":16,"edition":"cloud","generateSystemPassword":true}}' \
              --wait
          fi
      - name: Resume the HANA Cloud instance if the trial auto-stopped it
        # Real, recurring operational fact, not a one-time fix - the
        # trial auto-stops the HANA Cloud instance independently of CF
        # apps (a separate auto-stop policy), documented in the root
        # README's "Live on BTP" section since session 11, where it was
        # first hit and fixed manually. Hit again for real on this
        # deploy (procurement-core-db-deployer's task failed 4/4
        # retries) - codifying the fix here instead of doing it by hand
        # again, so every future deploy self-heals this instead of
        # failing on it. `cf service` reports `status: stopped` in its
        # plain-text output when this is the case (no clean `--json`
        # equivalent field this cf CLI version exposes for it, confirmed
        # live) - grep for it rather than assuming a JSON shape that
        # doesn't exist.
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s ${{ inputs.environment }}
          if cf service procureiq-${{ inputs.environment }}-hana-cloud | grep -qi "status:.*stopped"; then
            echo "HANA Cloud instance is stopped - resuming (takes a few minutes)..."
            cf update-service procureiq-${{ inputs.environment }}-hana-cloud \
              -c '{"data":{"serviceStopped":false}}' --wait
          else
            echo "HANA Cloud instance is already running"
          fi
      - name: cf login and deploy
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s ${{ inputs.environment }}
          cf deploy mta_archives/*.mtar -e mtaext-${{ inputs.environment }}.mtaext -f

  ai-copilot:
    needs: [verify-confirmation]
    if: always() && needs.verify-confirmation.result != 'failure'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: services/ai-copilot
    steps:
      - uses: actions/checkout@v4
      - name: Install cf CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
      - name: cf login and push
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s ${{ inputs.environment }}
          cf push -f manifest.yml

  legacy-erp-gateway:
    needs: [verify-confirmation]
    if: always() && needs.verify-confirmation.result != 'failure'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: services/legacy-erp-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Install cf CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
      - name: cf login and push
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s ${{ inputs.environment }}
          cf push -f manifest.yml

  api-gateway:
    # The one real ordering dependency in this landscape: api-gateway
    # needs procurement-core's live route to set PROCUREMENT_CORE_URL.
    needs: [procurement-core]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Install cf CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
      - name: cf login, push, and wire the live procurement-core URL
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s ${{ inputs.environment }}
          cf push -f manifest.yml
          CORE_GUID=$(cf app procurement-core-srv --guid)
          CORE_URL=$(cf curl "/v3/apps/${CORE_GUID}/routes" | jq -r '.resources[0].url')
          cf set-env api-gateway PROCUREMENT_CORE_URL "https://${CORE_URL}/procurement"
          cf restage api-gateway

  wire-procurement-core-outbound-urls:
    # The reverse direction from api-gateway's wiring above:
    # procurement-core calls OUT to legacy-erp-gateway (a real CF route,
    # queried live below) and spend-anomaly-detector (srv/lib/
    # destination.js, srv/lib/events.js) - the same env-var-override
    # mechanism destination.js already documents for docker-compose, here
    # pointed at real deployed routes instead of container names.
    #
    # spend-anomaly-detector's URL is a hardcoded literal, not queried
    # live like legacy-erp-gateway's - real, deliberate difference: it
    # moved back to its natural home, Kyma (kyma-deploy.yml), once SAP
    # approved the trial request, so there's no `cf app` to query for it
    # anymore. Its APIRule host is this trial cluster's real, confirmed
    # domain (services/spend-anomaly-detector/k8s/apirule.yaml's
    # `hosts: [spend-anomaly-detector-dev]` + this trial's real cluster
    # domain, cd97393.kyma.ondemand.com - see infra/terraform/README.md's
    # Kyma section) - update this literal if the trial cluster is ever
    # recreated (a new trial has a new, different shoot name/domain).
    needs: [procurement-core, legacy-erp-gateway]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SPEND_ANOMALY_DETECTOR_URL: https://spend-anomaly-detector-dev.cd97393.kyma.ondemand.com/events/purchase-order-created
    steps:
      - name: Install cf CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
      - name: cf login and wire the live routes
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s ${{ inputs.environment }}

          LEGACY_GUID=$(cf app legacy-erp-gateway --guid)
          LEGACY_URL=$(cf curl "/v3/apps/${LEGACY_GUID}/routes" | jq -r '.resources[0].url')

          cf set-env procurement-core-srv SPEND_ANOMALY_DETECTOR_URL "$SPEND_ANOMALY_DETECTOR_URL"
          cf set-env procurement-core-srv LEGACY_SUPPLIER_ERP_URL "https://${LEGACY_URL}"
          cf restage procurement-core-srv
