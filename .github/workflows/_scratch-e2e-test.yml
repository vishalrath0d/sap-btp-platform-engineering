name: scratch - e2e test

# Temporary, final verification - real password-grant token, then
# exercise the full requisition -> submit -> approve -> PO workflow
# live over HTTP against the deployed instance, plus check the Fiori
# preview UI's real response. Delete this file once checked.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install cf CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf
      - name: cf login, get xsuaa client creds
        env:
          CF_USERNAME: ${{ secrets.BTP_USERNAME }}
          CF_PASSWORD: ${{ secrets.BTP_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s dev
          cf create-service-key procurement-core-xsuaa token-test >/dev/null 2>&1 || true
          CREDS=$(cf service-key procurement-core-xsuaa token-test | sed -n '/{/,$p')
          {
            echo "CLIENT_ID=$(echo "$CREDS" | jq -r '.credentials.clientid')"
            echo "CLIENT_SECRET=$(echo "$CREDS" | jq -r '.credentials.clientsecret')"
            echo "TOKEN_URL=$(echo "$CREDS" | jq -r '.credentials.url')"
          } >> "$GITHUB_ENV"

      - name: real end-to-end test
        env:
          BTP_USERNAME: ${{ secrets.BTP_USERNAME }}
          BTP_PASSWORD: ${{ secrets.BTP_PASSWORD }}
        run: |
          CORE=https://4cbf0c12trial-dev-procurement-core-srv.cfapps.us10-001.hana.ondemand.com

          echo "=== fiori preview (no auth) ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "$CORE/\$fiori-preview/ProcurementService/PurchaseRequisitions"

          TOKEN=$(curl -s "$TOKEN_URL/oauth/token" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "username=$BTP_USERNAME" \
            --data-urlencode "password=$BTP_PASSWORD" \
            --data-urlencode "response_type=token" | jq -r '.access_token')
          echo "got token: $([ -n "$TOKEN" ] && echo yes || echo no)"

          echo "=== fiori preview WITH auth ==="
          curl -s -o /tmp/fiori.html -w "HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" "$CORE/\$fiori-preview/ProcurementService/PurchaseRequisitions"
          head -c 300 /tmp/fiori.html; echo ""

          echo "=== GET PurchaseRequisitions ==="
          curl -s -H "Authorization: Bearer $TOKEN" "$CORE/procurement/PurchaseRequisitions" | jq '.value[0:2]'

          echo "=== pick an existing supplier ==="
          SUPPLIER_ID=$(curl -s -H "Authorization: Bearer $TOKEN" "$CORE/procurement/Suppliers?\$top=1" | jq -r '.value[0].ID')
          echo "supplier: $SUPPLIER_ID"

          echo "=== create a new PurchaseRequisition (DRAFT) ==="
          PR=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"description\":\"E2E test requisition\",\"currency\":\"USD\",\"supplier_ID\":\"$SUPPLIER_ID\"}" \
            "$CORE/procurement/PurchaseRequisitions")
          echo "$PR" | jq '.'
          PR_ID=$(echo "$PR" | jq -r '.ID')

          echo "=== add a line item ==="
          curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"requisition_ID\":\"$PR_ID\",\"material\":\"E2E-TEST-MAT\",\"quantity\":2,\"unitPrice\":50}" \
            "$CORE/procurement/PurchaseRequisitionItems" | jq '.'

          echo "=== submit ==="
          curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$CORE/procurement/PurchaseRequisitions($PR_ID)/ProcurementService.submit" | jq '.'

          echo "=== approve ==="
          curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"comment":"e2e test approval"}' \
            "$CORE/procurement/PurchaseRequisitions($PR_ID)/ProcurementService.approve" | jq '.'
