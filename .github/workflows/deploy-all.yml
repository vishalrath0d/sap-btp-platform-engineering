name: deploy all (orchestrated)

# Deploys the whole landscape in one manual trigger, in the correct
# dependency order:
#
#   terraform apply  ->  cf-deploy.yml  ->  kyma-deploy.yml
#
# Reuses cf-deploy.yml and kyma-deploy.yml as real reusable workflows
# (`workflow_call`) rather than duplicating their steps a third time -
# each of those two files is now the single source of truth for how its
# runtime deploys, whether triggered standalone or from here.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        required: true
        type: choice
        options: [dev, qa, prod]
      confirm:
        description: 'Type "deploy" to confirm you intend to run this against the real BTP account'
        required: true

jobs:
  verify-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::Confirmation input must be exactly 'deploy' - got '${{ inputs.confirm }}'"
          exit 1

  terraform-apply:
    needs: verify-confirmation
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_VAR_btp_username: ${{ secrets.BTP_USERNAME }}
      TF_VAR_btp_password: ${{ secrets.BTP_PASSWORD }}
      TF_WORKSPACE: procureiq-${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - run: terraform init
      - run: terraform apply -auto-approve -input=false -var-file="environments/${{ inputs.environment }}/terraform.tfvars"

  cf-deploy:
    needs: terraform-apply
    uses: ./.github/workflows/cf-deploy.yml
    with:
      environment: ${{ inputs.environment }}
    secrets:
      CF_USERNAME: ${{ secrets.CF_USERNAME }}
      CF_PASSWORD: ${{ secrets.CF_PASSWORD }}

  kyma-deploy:
    needs: terraform-apply
    uses: ./.github/workflows/kyma-deploy.yml
    with:
      environment: ${{ inputs.environment }}
    secrets:
      KYMA_KUBECONFIG: ${{ secrets.KYMA_KUBECONFIG }}
