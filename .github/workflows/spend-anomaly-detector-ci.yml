name: spend-anomaly-detector CI

# The one service in this repo that deploys to Kyma, not Cloud Foundry -
# see src/server.js's own comment on why (event-driven, container-native,
# the natural fit for a K8s runtime rather than an MTA/buildpack app). CF
# services in this repo (procurement-core, ai-copilot, api-gateway,
# legacy-erp-gateway) build with buildpacks and `cf push`/`cf deploy`;
# this one builds a real container image and pushes it to GitHub Container
# Registry - a genuinely different build shape, not the same pipeline with
# different target names. Test and image-build stay here (path-filtered,
# same reasoning as every other service's CI); the actual kubectl/BTP
# Operator/APIRule deploy lives in .github/workflows/kyma-deploy.yml, this
# repo's Kyma-side counterpart to cf-deploy.yml.

on:
  push:
    branches: [main]
    paths:
      - "services/spend-anomaly-detector/**"
      - ".github/workflows/spend-anomaly-detector-ci.yml"
  pull_request:
    paths:
      - "services/spend-anomaly-detector/**"

defaults:
  run:
    working-directory: services/spend-anomaly-detector

permissions:
  contents: read
  packages: write # needed to push to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/spend-anomaly-detector/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image=ghcr.io/${{ github.repository }}/spend-anomaly-detector:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/spend-anomaly-detector
          push: true
          tags: ${{ steps.meta.outputs.image }}
