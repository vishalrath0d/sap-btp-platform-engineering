name: terraform plan (dev)

# Runs on every PR touching infra/terraform - read-only, safe to run
# automatically. Posts the plan as a PR comment so a review can happen
# without anyone needing to run terraform locally at all, which is the
# point of not applying from a laptop in the first place.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

env:
  # One shared root module (infra/terraform/) for every environment - this
  # workflow only ever varies TF_ENVIRONMENT and which -var-file/
  # -backend-config it passes, never the working directory or the .tf
  # files themselves. See infra/terraform/README.md for why.
  TF_ENVIRONMENT: dev
  TF_WORKSPACE_NAME: procureiq-dev

defaults:
  run:
    working-directory: infra/terraform

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }} # HCP Terraform API token - see infra/terraform/README.md

      - name: terraform fmt -check
        run: terraform fmt -check -recursive .

      - name: terraform init
        run: |
          terraform init \
            -backend-config="organization=${{ secrets.TF_CLOUD_ORGANIZATION }}" \
            -backend-config="workspaces.name=${{ env.TF_WORKSPACE_NAME }}"

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -input=false -var-file="environments/${{ env.TF_ENVIRONMENT }}/terraform.tfvars"
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan (${{ env.TF_ENVIRONMENT }})
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan step failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
