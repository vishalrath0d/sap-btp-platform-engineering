name: terraform plan

# Runs on every PR touching infra/terraform - read-only, safe to run
# automatically. Posts the plan as a PR comment so a review can happen
# without anyone needing to run terraform locally at all, which is the
# point of not applying from a laptop in the first place.
#
# Also runnable on demand (`workflow_dispatch`) - a real gap this exposed:
# a PR merging is a `push`, not a `pull_request`, so this workflow
# correctly stays silent on merge (by design, not a bug - it's not meant
# to re-run automatically post-merge). But that left no way to get a
# fresh plan against `main` right before running terraform-apply.yml,
# which is exactly when you'd want one. `workflow_dispatch` fixes that
# without changing the PR-triggered behavior at all.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch: {}

env:
  # One shared root module (infra/terraform/) for every environment - this
  # workflow only ever varies TF_ENVIRONMENT/TF_WORKSPACE and which
  # -var-file it passes, never the working directory or the .tf files
  # themselves. See infra/terraform/README.md.
  TF_ENVIRONMENT: dev
  TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: procureiq-dev
  # The workspace's Execution Mode is "Local" (GitHub Actions runs plan/
  # apply, HCP Terraform only stores state) - which means HCP Terraform's
  # own Variables UI is unavailable for this workspace (confirmed: the
  # Variables tab genuinely doesn't exist for Local-execution-mode
  # workspaces) and never gets evaluated even if it did. Variables have to
  # reach the Terraform CLI directly, as TF_VAR_* env vars, from wherever
  # the CLI actually runs - here, that's these two secrets.
  TF_VAR_btp_username: ${{ secrets.BTP_USERNAME }}
  TF_VAR_btp_password: ${{ secrets.BTP_PASSWORD }}

defaults:
  run:
    working-directory: infra/terraform

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }} # HCP Terraform API token - see infra/terraform/README.md

      - name: terraform fmt -check
        run: terraform fmt -check -recursive .

      - name: terraform init
        run: terraform init

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -input=false -var-file="environments/${{ env.TF_ENVIRONMENT }}/terraform.tfvars"
        continue-on-error: true

      - name: Post plan as PR comment
        # Only meaningful on a real pull_request event - context.issue.number
        # doesn't exist for a workflow_dispatch run (there's no PR to
        # comment on), so this step is skipped there; the plan output is
        # still fully visible in this job's own log either way.
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        # Real bug hit on this exact PR: `${{ steps.plan.outputs.stdout }}`
        # (the wrapper output hashicorp/setup-terraform's `wrapper: true`
        # default captures automatically - no manual $GITHUB_OUTPUT needed)
        # was previously interpolated directly into the inline `script:`
        # text below. That substitution happens at the YAML level, before
        # Node ever sees the file - so it lands as literal JS *source*, not
        # a string value. Terraform plan output routinely contains
        # backticks and `${...}` (JSON-encoded `parameters` blocks, HCL
        # interpolation echoed in resource addresses/diffs) - either one
        # closes the template literal early, and whatever plan text follows
        # gets parsed as JS statements. That's exactly what produced
        # `SyntaxError: Unexpected identifier 'subaccount_id'` - a
        # `subaccount_id = "..."` line from the plan diff, landing outside
        # the (now-closed) string as a bare token. Fix: pass the plan text
        # through `env:` instead - an env var assignment is never
        # re-parsed as code - and read it at runtime via `process.env`.
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const maxLength = 60000; // GitHub PR comment body cap is 65536 chars
            let planText = process.env.PLAN_STDOUT || "(no output captured)";
            if (planText.length > maxLength) {
              planText = planText.slice(0, maxLength) + "\n\n... (truncated - see the full run log)";
            }
            const status = process.env.PLAN_OUTCOME === "success" ? "✅ Plan succeeded" : "❌ Plan failed";
            const output = `#### Terraform Plan (${status}) — ${{ env.TF_ENVIRONMENT }}\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${planText}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan step failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
