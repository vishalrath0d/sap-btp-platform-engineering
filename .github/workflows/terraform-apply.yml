name: terraform apply

# Deliberately workflow_dispatch-only (manual trigger), never on push -
# this project's instruction is "build it, don't deploy yet, test locally
# first, deploy after review." Also gated behind a per-environment GitHub
# Environment, which can (and should, before this is ever really used)
# have required reviewers configured - two independent gates, not one,
# before any real infrastructure changes.
#
# environment choice mirrors the real sm-infraforge/langfuse Jenkinsfile's
# `environmentChoices` pattern (setPipeline(..., environmentChoices:
# ENVIRONMENTS)) - one pipeline/workflow, environment selected at trigger
# time, not one workflow file per environment.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to apply"
        required: true
        type: choice
        options:
          - dev
          # qa and prod are listed as options for when they're real - see
          # environments/qa|prod/terraform.tfvars for why they'd fail today
          - qa
          - prod
      confirm:
        description: 'Type "apply" to confirm you intend to run this against the real BTP account'
        required: true

env:
  TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
  # TF_VAR_btp_username/password: see terraform-plan.yml's comment - this
  # workspace's Local execution mode means HCP Terraform's Variables UI
  # doesn't exist/apply, so credentials have to reach the CLI as env vars
  # from here instead.
  TF_VAR_btp_username: ${{ secrets.BTP_USERNAME }}
  TF_VAR_btp_password: ${{ secrets.BTP_PASSWORD }}
  # Empty/unset until the two-phase XSUAA apply's step 2 (see
  # infra/terraform/README.md) - Terraform's own default (null) for
  # xsuaa_xsappname makes role_collections no-op safely until then, so
  # this being unset is the correct starting state, not a placeholder to
  # fill in before the first apply.
  TF_VAR_xsuaa_xsappname: ${{ secrets.XSUAA_XSAPPNAME }}

defaults:
  run:
    working-directory: infra/terraform

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }} # configure required reviewers on
                                                            # each GitHub Environment (dev/qa/prod)
                                                            # before this job can ever run for real
    env:
      TF_WORKSPACE: procureiq-${{ github.event.inputs.environment }}
    steps:
      - name: Verify confirmation input
        if: github.event.inputs.confirm != 'apply'
        run: |
          echo "::error::Confirmation input must be exactly 'apply' - got '${{ github.event.inputs.confirm }}'"
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve -input=false -var-file="environments/${{ github.event.inputs.environment }}/terraform.tfvars"
