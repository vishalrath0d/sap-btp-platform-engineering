name: terraform apply

# Deliberately workflow_dispatch-only (manual trigger), never on push -
# this project's instruction is "build it, don't deploy yet, test locally
# first, deploy after review." Also gated behind a per-environment GitHub
# Environment, which can (and should, before this is ever really used)
# have required reviewers configured - two independent gates, not one,
# before any real infrastructure changes.
#
# environment choice mirrors the real sm-infraforge/langfuse Jenkinsfile's
# `environmentChoices` pattern (setPipeline(..., environmentChoices:
# ENVIRONMENTS)) - one pipeline/workflow, environment selected at trigger
# time, not one workflow file per environment.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to apply"
        required: true
        type: choice
        options:
          - dev
          # qa and prod are listed as options for when they're real - see
          # environments/qa|prod/terraform.tfvars for why they'd fail today
          - qa
          - prod
      confirm:
        description: 'Type "apply" to confirm you intend to run this against the real BTP account'
        required: true

env:
  TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
  # TF_VAR_btp_username/password: see terraform-plan.yml's comment - this
  # workspace's Local execution mode means HCP Terraform's Variables UI
  # doesn't exist/apply, so credentials have to reach the CLI as env vars
  # from here instead.
  TF_VAR_btp_username: ${{ secrets.BTP_USERNAME }}
  TF_VAR_btp_password: ${{ secrets.BTP_PASSWORD }}
  # TF_VAR_xsuaa_xsappname is set conditionally below, by the "Fetch the
  # real xsappname" step - real two-phase apply again (see infra/
  # terraform/variables.tf's xsuaa_xsappname description for why a
  # same-apply, Terraform-managed-duplicate-instance approach was
  # reverted: it genuinely conflicted with procurement-core's own
  # MTA-created XSUAA instance at the broker level, confirmed live).

defaults:
  run:
    working-directory: infra/terraform

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }} # configure required reviewers on
                                                            # each GitHub Environment (dev/qa/prod)
                                                            # before this job can ever run for real
    env:
      TF_WORKSPACE: procureiq-${{ github.event.inputs.environment }}
    steps:
      - name: Verify confirmation input
        if: github.event.inputs.confirm != 'apply'
        run: |
          echo "::error::Confirmation input must be exactly 'apply' - got '${{ github.event.inputs.confirm }}'"
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        run: terraform init

      - name: Install cf CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | tar -zx
          sudo mv cf8 /usr/local/bin/cf

      - name: Fetch the real xsappname from procurement-core's own MTA-created XSUAA instance
        # Real two-phase apply by design (see infra/terraform/variables.tf's
        # xsuaa_xsappname description). Skips cleanly, leaving
        # TF_VAR_xsuaa_xsappname unset (modules/role-collections tolerates
        # the resulting empty string) if procurement-core hasn't been
        # deployed yet - a genuinely first-ever apply on a fresh account.
        # Org name hardcoded the same way cf-deploy.yml's own comment
        # documents (this trial's real, SAP-assigned org, not a name this
        # project chose) - update alongside that file if it ever changes.
        env:
          CF_USERNAME: ${{ secrets.BTP_USERNAME }}
          CF_PASSWORD: ${{ secrets.BTP_PASSWORD }}
        run: |
          cf api https://api.cf.us10-001.hana.ondemand.com
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o 4cbf0c12trial -s ${{ github.event.inputs.environment }}
          if cf service procurement-core-xsuaa >/dev/null 2>&1; then
            cf create-service-key procurement-core-xsuaa terraform-lookup >/dev/null 2>&1 || true
            XSAPPNAME=$(cf service-key procurement-core-xsuaa terraform-lookup | sed -n '/{/,$p' | jq -r '.credentials.xsappname')
            echo "Real xsappname: ${XSAPPNAME}"
            echo "TF_VAR_xsuaa_xsappname=${XSAPPNAME}" >> "$GITHUB_ENV"
          else
            echo "procurement-core-xsuaa doesn't exist yet - role_collections will no-op this apply, re-run after deploying procurement-core"
          fi

      - name: terraform apply
        run: terraform apply -auto-approve -input=false -var-file="environments/${{ github.event.inputs.environment }}/terraform.tfvars"
