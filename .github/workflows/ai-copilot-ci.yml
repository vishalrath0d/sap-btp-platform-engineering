name: ai-copilot CI

# Test-only, path-filtered - the standard, real monorepo CI shape: a
# change to this service shouldn't re-run every other service's tests,
# and each PR gets one fast, correctly-scoped status check per service.
# Deploy lives in .github/workflows/cf-deploy.yml instead, one pipeline
# for the whole Cloud Foundry-bound landscape (this service + api-gateway
# + legacy-erp-gateway + procurement-core) rather than a separate gated
# job duplicated into every service's own file - see that file's header
# comment for why deploy and test split this way.

on:
  push:
    branches: [main]
    paths:
      - "services/ai-copilot/**"
      - ".github/workflows/ai-copilot-ci.yml"
  pull_request:
    paths:
      - "services/ai-copilot/**"

defaults:
  run:
    working-directory: services/ai-copilot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/ai-copilot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
