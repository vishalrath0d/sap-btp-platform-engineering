name: api-gateway CI

# Test-only, path-filtered - see ai-copilot-ci.yml's comment for why
# deploy lives in .github/workflows/cf-deploy.yml instead (this service's
# deploy job there also sets PROCUREMENT_CORE_URL as a real CF env var
# post-push, not baked into manifest.yml).

on:
  push:
    branches: [main]
    paths:
      - "services/api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"
  pull_request:
    paths:
      - "services/api-gateway/**"

defaults:
  run:
    working-directory: services/api-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/api-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
