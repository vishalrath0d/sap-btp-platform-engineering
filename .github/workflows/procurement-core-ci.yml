name: procurement-core CI

# GitHub Actions must live at the repo root (.github/workflows/) - GitHub
# doesn't discover workflows anywhere else, unlike Piper's .pipeline/config.yml
# which lives with the app it builds. Test and MTA-build stay path-filtered
# per service (this file scopes to procurement-core changes only) - the
# standard, real monorepo CI shape. Deploy lives in
# .github/workflows/cf-deploy.yml instead, one pipeline for the whole
# Cloud Foundry-bound landscape - see that file's header comment for why
# deploy doesn't follow the same one-file-per-service split test does.

on:
  push:
    branches: [main]
    paths:
      - "services/procurement-core/**"
      - ".github/workflows/procurement-core-ci.yml"
  pull_request:
    paths:
      - "services/procurement-core/**"

defaults:
  run:
    working-directory: services/procurement-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/procurement-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-mta:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cloud MTA Build Tool
        run: npm install -g mbt

      - name: cds build --production
        run: |
          npm ci
          # Bare `npx cds` intermittently fails ("could not determine
          # executable to run") - real failure hit live on this branch's
          # CI. @sap/cds is a real dependency here but doesn't ship the
          # `cds` CLI itself (that's the separate @sap/cds-dk package) -
          # npx normally papers over this by fetching @sap/cds-dk on the
          # fly, but that on-the-fly resolution isn't reliable. Pinning it
          # explicitly with `-p` is the fix, not a network retry - same
          # root cause this service's own Dockerfile already documents
          # for why it calls ./node_modules/.bin/cds-deploy directly.
          npx -p @sap/cds-dk cds build --production

      - name: mbt build
        run: mbt build --platform cf

      - uses: actions/upload-artifact@v4
        with:
          name: procurement-core-mtar
          path: services/procurement-core/mta_archives/*.mtar
          retention-days: 14
