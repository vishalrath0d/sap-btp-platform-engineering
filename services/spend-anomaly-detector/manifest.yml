# Plain `cf push` manifest - the temporary CF deployment path while this
# service's real target (Kyma) is blocked on SAP's trial-approval process
# (see infra/terraform/modules/kyma-env/main.tf and docs/next/next.md).
# Not a redesign: the app itself doesn't change at all, only where it
# runs - it's still the same plain Express service, its /events/purchase-
# order-created webhook still works identically over plain HTTP either
# way. What's genuinely different on CF, stated plainly rather than
# hidden: the real target architecture's gateway-level JWT auth (Kyma's
# APIRule validating against the XSUAA instance in k8s/service-instance.yaml)
# has no CF equivalent wired up here - this webhook is open/unauthenticated
# on CF, same posture it already has in local Docker Compose testing.
# Revert to k8s/*.yaml + kyma-deploy.yml/piper-kyma-deploy.yml once SAP
# approves the trial Kyma request - nothing in k8s/ was touched to make
# room for this file.
---
applications:
  - name: spend-anomaly-detector
    memory: 128M
    disk_quota: 256M
    buildpacks:
      - nodejs_buildpack
    command: npm start
    env:
      NODE_ENV: production
